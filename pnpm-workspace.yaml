packages:
  - apps/*
  - packages/*
allowBuilds:
  # Telemetry pinger pulled in by swagger-ui-dist — never needed.
  '@scarf/scarf': false
  # Optional native speed-up for bullmq's msgpackr; the pure-JS fallback is fine.
  msgpackr-extract: false
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@hookform/resolvers@6.0.1'
  - framer-motion@14.7.1
  - lucide-react@1.62.0
  - motion-dom@14.7.1
  - motion-utils@14.7.0
  - motion@14.7.1
overrides:
  # Security: patched releases of transitive dependencies (see `pnpm audit --prod`).
  postcss@<8.5.23: ^8.5.23
  multer@<2.5.0: ^2.5.0
