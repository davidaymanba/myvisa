packages:
  - apps/*
  - packages/*
allowBuilds:
  # Telemetry pinger pulled in by swagger-ui-dist — never needed.
  '@scarf/scarf': false
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@hookform/resolvers@6.0.1'
  - framer-motion@14.7.1
  - lucide-react@1.62.0
  - motion-dom@14.7.1
  - motion-utils@14.7.0
  - motion@14.7.1
